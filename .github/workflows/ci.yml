name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm arch
      - run: pnpm build

      # Electron 45 downloads its binary on first use; do it here, not inside the first test's timeout.
      - name: Download Electron
        working-directory: apps/desktop
        run: node -e "require('electron')"
      # Ubuntu 24.04 restricts the user namespaces Chromium's sandbox needs. Lifting the restriction on
      # the runner keeps the sandbox ON during the end-to-end tests (locally they fall back to --no-sandbox).
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm exec playwright test
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7
