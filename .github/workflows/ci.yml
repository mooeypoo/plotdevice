name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm arch
      - name: Performance limits (alone, so other tests don't skew the timings)
        run: pnpm perf
      - run: pnpm build

      # Electron 45 downloads its binary on first use; do it here, not inside the first test's timeout.
      - name: Download Electron
        working-directory: apps/desktop
        run: node -e "require('electron')"
      # Ubuntu 24.04 restricts the user namespaces Chromium's sandbox needs. Lifting the restriction on
      # the runner keeps the sandbox ON during the end-to-end tests (locally they fall back to --no-sandbox).
      - name: Allow Chromium's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm exec playwright test
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright test

      # Installers (Milestone 7), tested as an author would install and remove them.
      - name: Build the installers
        working-directory: apps/desktop
        run: pnpm exec electron-builder --publish never
      - name: End-to-end tests on the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e:packaged
      - name: End-to-end tests on the packaged app (Windows)
        if: runner.os == 'Windows'
        run: pnpm e2e:packaged
      - name: Install, check and remove the .deb
        if: runner.os == 'Linux'
        working-directory: apps/desktop/dist
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils appstream
          sudo apt-get install -y ./plotdevice_*_amd64.deb
          test -x "/opt/Plot Device/plotdevice"
          desktop-file-validate /usr/share/applications/plotdevice.desktop
          appstreamcli validate --no-net --explain /usr/share/metainfo/tech.moriel.plotdevice.metainfo.xml
          sudo apt-get remove -y plotdevice
          test ! -e "/opt/Plot Device/plotdevice"
      - name: Install, check and remove the Windows installer
        if: runner.os == 'Windows'
        working-directory: apps/desktop/dist
        shell: pwsh
        run: |
          $installer = Get-ChildItem plotdevice-*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter plotdevice.exe | Select-Object -First 1
          if (-not $app) { throw 'Plot Device was not installed' }
          $uninstaller = Get-ChildItem -Path $app.DirectoryName -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $app.FullName) { throw 'Plot Device was not uninstalled' }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*-setup.exe
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7
