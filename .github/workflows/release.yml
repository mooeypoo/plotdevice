name: Release

# A tag such as v0.2.0 builds the installers and attaches them to a DRAFT release. Nothing is public
# until the owner publishes the draft (Milestone 7, decision 3).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Plot Device ${GITHUB_REF_NAME#v}" --notes "Draft: review, then publish."

  installers:
    needs: draft
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the installers
        working-directory: apps/desktop
        run: pnpm build && pnpm exec electron-builder --publish never
      - name: Attach them to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/desktop/dist
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber $(ls *.AppImage *.deb *-setup.exe 2>/dev/null)
