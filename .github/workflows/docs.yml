name: Website

# Checks the site at https://plotdevice.app (Milestones 10 and 24) on every pull request and push that
# touches it: the build (every link and every button name), the translation report, and the site tests.
# Netlify builds and publishes the site itself, from netlify.toml; this workflow publishes nothing.
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/i18n/**'
      - 'packages/ui-vue/src/theme/**'
      - 'samples/**'
      - 'tooling/site-translations.mjs'
      - 'netlify.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - 'packages/i18n/**'
      - 'packages/ui-vue/src/theme/**'
      - 'samples/**'
      - 'tooling/site-translations.mjs'
      - 'netlify.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The site never runs the app; its screenshots are in the repository (`pnpm site:screenshots`).
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the site, as Netlify does (checks every link and every button name)
        run: pnpm site:build && pnpm site:updates
      - name: Translation report
        run: pnpm site:translations
      - name: Browser for the site tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Accessibility, right-to-left and the site's files
        run: pnpm site:test
