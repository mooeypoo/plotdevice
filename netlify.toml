# Plot Device's website, plotdevice.app (Milestone 24). Netlify builds it from this repository: connect
# the repository in Netlify, and these settings do the rest. No secrets are needed.
#
# The guide's screenshots are in the repository (apps/site/src/assets/screens), made from the real app
# with `pnpm site:screenshots`, so building the site never runs the app. Redirects and headers are in
# apps/site/public (_redirects, _headers), so they travel with the site.

[build]
  publish = "apps/site/dist"
  # The site, then a copy of the newest release's update file at /updates/latest.json.
  command = "pnpm site:build && pnpm site:updates"
  # Builds only when something the site is made from changed: its pages, the app's words and colours,
  # the sample books it shows, or these settings. Pull requests get a preview either way.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/site packages/i18n packages/ui-vue/src/theme samples netlify.toml package.json pnpm-lock.yaml"

[build.environment]
  # The site never runs the app, so the install skips Electron's download.
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
