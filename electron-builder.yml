# App identity: see AGENTS.md ("App identity"). These values must never change.
appId: tech.moriel.plotdevice
productName: Plot Device
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{docs,fixtures,tools,.github}/**'
  - '!**/*.test.ts'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.dependency-cruiser.cjs,.prettierignore,.prettierrc.yaml,.editorconfig,.gitattributes,.nvmrc}'
  - '!{AGENTS.md,CLAUDE.md,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc}'
  - '!tsconfig*.json'
asarUnpack:
  - resources/**
win:
  target: nsis
  executableName: plotdevice
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  target:
    - AppImage
    - deb
  executableName: plotdevice
  # One PNG per size (build/icons/16x16.png …), rendered by `npm run icons`.
  icon: build/icons
  # Wayland/X11 window association: the running window's app_id must match the .desktop file.
  syncDesktopName: true
  maintainer: Moriel Schottlender <mooeypoo@gmail.com>
  vendor: Moriel Schottlender
  category: Office
  synopsis: Write a novel in plain markdown files
  description: >-
    A local writing and story-planning app for novelists. Organize chapters,
    characters, outlines, and timelines while keeping your novel in ordinary
    Markdown files. Supports English, Hebrew, and mixed-direction prose.
  # "Open With → Plot Device" on folders in file managers; the folder arrives as a file:// address.
  mimeTypes:
    - inode/directory
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
  packageCategory: editors
  fpm:
    - build/tech.moriel.plotdevice.metainfo.xml=/usr/share/metainfo/tech.moriel.plotdevice.metainfo.xml
    - build/debian-copyright=/usr/share/doc/plotdevice/copyright
    - LICENSE=/usr/share/doc/plotdevice/LICENSE
npmRebuild: false
publish: null
