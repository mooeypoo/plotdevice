<meta charset="utf-8">
<title>Plot Device Screen Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* A review desk: pick a screen, a language and a theme; see U1's capture beside today's. The page
   follows the viewer's theme; the screenshots show the app in the theme chosen on the page. */
:root {
  --bg: #101114;
  --surface: #17181c;
  --line: #2a2b31;
  --text: #e3ddd1;
  --muted: #98948b;
  --accent: #d8b26e;
  --accent-ink: #1a1408;
  --font-ui: 'IBM Plex Sans', system-ui, sans-serif;
  --font-prose: 'Literata', Georgia, serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f1ea; --surface: #fbf9f5; --line: #ddd6c8;
    --text: #2a2722; --muted: #6c665c; --accent: #87591a; --accent-ink: #ffffff;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f1ea; --surface: #fbf9f5; --line: #ddd6c8;
  --text: #2a2722; --muted: #6c665c; --accent: #87591a; --accent-ink: #ffffff;
  color-scheme: light;
}

body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font-ui); }
.wrap {
  max-width: 1400px; margin: 0 auto; display: grid; gap: 20px;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: grid; gap: 6px; max-width: 72ch; }
h1 { margin: 0; font: 600 30px/1.15 var(--font-prose); text-wrap: balance; }
header p { margin: 0; color: var(--muted); }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

.controls {
  display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  padding-block: 12px; border-block: 1px solid var(--line);
}
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.screens { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  font: 500 13px/1 var(--font-ui); color: var(--text); cursor: pointer;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
}
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.seg button { border: 0; border-radius: 999px; background: transparent; color: var(--muted); padding: 7px 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; }
figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
figcaption { color: var(--muted); font-size: 13px; }
figcaption b { color: var(--text); font-weight: 600; }
.frame { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.frame img { display: block; width: 100%; height: auto; max-width: 100%; }
.missing { padding: 48px 20px; color: var(--muted); text-align: center; font-family: var(--font-prose); }
.note { max-width: 72ch; margin: 0; color: var(--muted); }
.note b { color: var(--text); }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">U2 · screen review</span>
    <h1>Every screen, before and after the redesign</h1>
    <p>Choose a screen, a language and a theme. On the left, the app as U1's audit found it (dark only, since the light theme is new); on the right, the app today.</p>
  </header>

  <div class="controls" role="group" aria-label="Review options">
    <div class="group">
      <span class="label" id="lbl-screen">Screen</span>
      <div class="screens" id="screens" role="group" aria-labelledby="lbl-screen"></div>
    </div>
    <div class="group">
      <span class="label" id="lbl-lang">Language</span>
      <div class="seg" role="group" aria-labelledby="lbl-lang">
        <button type="button" id="lang-en" aria-pressed="true">English</button>
        <button type="button" id="lang-he" aria-pressed="false">עברית</button>
      </div>
    </div>
    <div class="group">
      <span class="label" id="lbl-theme">App theme</span>
      <div class="seg" role="group" aria-labelledby="lbl-theme">
        <button type="button" id="theme-dark" aria-pressed="true">Dark</button>
        <button type="button" id="theme-light" aria-pressed="false">Light</button>
      </div>
    </div>
  </div>

  <div class="compare">
    <figure>
      <figcaption><b>Before</b> · U1 audit</figcaption>
      <div class="frame" id="before"></div>
    </figure>
    <figure>
      <figcaption><b>After</b> · today</figcaption>
      <div class="frame" id="after"></div>
    </figure>
  </div>
  <p class="note" id="note"></p>
</div>

<script>
(function () {
  // [scenario id, name, note]. A scenario with no U1 capture is new since the audit.
  var SCREENS = [
    ['writing', 'Writing', 'One row of chrome; the place in the bar; Details compact; "In this chapter" under the heading.'],
    ['revise', 'Side by side', 'A read-only split beside the page; More ▾ when a side has more than three panels.'],
    ['focus', 'Focus', 'The page alone. Lines away from the one you write dim, links included (R4).'],
    ['select-open', 'A select', 'Every select is the shared one, drawn over the page (U2a).'],
    ['app-menu', 'The ⋯ menu', 'Interface language, Theme, Appearance, Layout and Close project (D2).'],
    ['palette', 'Go to…', 'Recent, Suggested, then everything else (F13).'],
    ['dock-menu', 'A panel ⋯', 'One menu per panel: its moves, the side\'s, then Expand (F5).'],
    ['peek', 'Peek', 'Pin · Open beside · Open · Edit details (D6).'],
    ['cards', 'Cards', 'Actions wrap as a row in a narrow panel (R1).'],
    ['capture', 'Capture', 'One line into the outline\'s Inbox.'],
    ['appearance', 'Appearance', 'Shared sliders, select and switches (U2a).'],
    ['conflict', 'A conflict', 'The recovery banner on the theme\'s warning tint.'],
    ['board', 'Board', 'The outline\'s name, Edit as text, ?; soft edges; cards above their columns (R5).'],
    ['board-card-menu', 'Beat menu', 'Beat actions, drawn over the board.'],
    ['board-add-card', 'Add a beat', '+ Add beat at the foot of a column.'],
    ['board-add-column', 'Add a column', '+ Add column after the last column, before the Inbox (D5).'],
    ['board-empty', 'Empty board', 'An outline without columns offers + Add column (R3).'],
    ['overview', 'Overview', 'Chapters, status, threads and synopses, in Plot (D1).'],
    ['timeline', 'Timeline', 'Reading or story order, by thread or character.'],
    ['interactions', 'Interactions', 'Which characters share chapters.'],
    ['welcome', 'Welcome', 'The wordmark, recent projects and the interface language.'],
    ['initialize', 'New project', 'The heading in the prose face, no longer Times (R2).']
  ];
  var BEFORE = ['writing', 'revise', 'focus', 'palette', 'dock-menu', 'peek', 'cards', 'capture', 'appearance', 'board', 'board-card-menu', 'board-add-card', 'overview', 'timeline', 'interactions', 'welcome', 'initialize'];

  var state = { screen: 'writing', lang: 'en', theme: 'dark' };
  try {
    var saved = JSON.parse(localStorage.getItem('u2-review') || '{}');
    for (var key in saved) if (key in state) state[key] = saved[key];
  } catch (e) {}

  var box = document.getElementById('screens');
  SCREENS.forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button'; b.id = 'screen-' + s[0]; b.textContent = s[1];
    b.addEventListener('click', function () { state.screen = s[0]; render(); });
    box.appendChild(b);
  });
  [['lang-en', 'lang', 'en'], ['lang-he', 'lang', 'he'], ['theme-dark', 'theme', 'dark'], ['theme-light', 'theme', 'light']].forEach(function (c) {
    document.getElementById(c[0]).addEventListener('click', function () { state[c[1]] = c[2]; render(); });
  });

  /** An image that tries the published path first, then the repository's. */
  function image(paths, alt) {
    var img = document.createElement('img');
    var tried = 0;
    img.alt = alt;
    img.addEventListener('error', function () {
      tried += 1;
      if (tried < paths.length) img.src = paths[tried];
    });
    img.src = paths[0];
    return img;
  }

  function missing(text) {
    var p = document.createElement('p');
    p.className = 'missing';
    p.textContent = text;
    return p;
  }

  function render() {
    try { localStorage.setItem('u2-review', JSON.stringify(state)); } catch (e) {}
    var s = SCREENS.filter(function (x) { return x[0] === state.screen; })[0];
    SCREENS.forEach(function (x) { document.getElementById('screen-' + x[0]).setAttribute('aria-pressed', String(x[0] === s[0])); });
    ['lang-en', 'lang-he'].forEach(function (id) { document.getElementById(id).setAttribute('aria-pressed', String(id === 'lang-' + state.lang)); });
    ['theme-dark', 'theme-light'].forEach(function (id) { document.getElementById(id).setAttribute('aria-pressed', String(id === 'theme-' + state.theme)); });
    var language = state.lang === 'he' ? 'Hebrew' : 'English';

    var before = document.getElementById('before');
    before.replaceChildren(
      BEFORE.indexOf(s[0]) < 0
        ? missing('New since the audit.')
        : state.theme === 'light'
          ? missing('The light theme is new: there was no light screen before.')
          : image(['before/' + s[0] + '.' + state.lang + '.png', '../u1/screens/' + s[0] + '.' + state.lang + '.png'], s[1] + ' before the redesign, ' + language + ', dark')
    );
    var after = document.getElementById('after');
    var file = s[0] + '.' + state.lang + '.' + state.theme + '.png';
    after.replaceChildren(image(['screens/' + file], s[1] + ' today, ' + language + ', ' + state.theme));
    document.getElementById('note').textContent = s[2];
  }
  render();
})();
</script>
